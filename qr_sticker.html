<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FreshGuard Vault - Hardware Setup QR Code Sticker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: #0f172a;
    }
    .sticker {
      background: #ffffff;
      border: 3px solid #10b981;
      border-radius: 24px;
      padding: 32px;
      width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #059669;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 800;
    }
    p.sub {
      font-size: 12px;
      color: #64748b;
      margin: 0 0 20px 0;
    }
    img.qr {
      width: 240px;
      height: 240px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }
    .info {
      margin-top: 18px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      font-size: 12px;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #64748b;
    }
    .val {
      font-weight: 700;
      font-family: monospace;
    }
    .instructions {
      font-size: 11px;
      color: #059669;
      margin-top: 14px;
      font-weight: 600;
    }
    .print-btn {
      margin-top: 24px;
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    @media print {
      body { background: white; padding: 0; }
      .print-btn { display: none; }
      .sticker { box-shadow: none; border: 2px solid #000; }
    }
  </style>
</head>
<body>

  <div class="sticker">
    <div class="badge">Hardware Setup QR</div>
    <h2>FreshGuard Produce Vault</h2>
    <p class="sub">Autonomous Botanical Chamber Controller</p>

    <img class="qr" src="freshguard_wifi_qr.png" alt="Wi-Fi Setup QR Code">

    <div class="info">
      <div class="info-row">
        <span class="label">Wi-Fi Hotspot:</span>
        <span class="val">FreshGuard-Setup</span>
      </div>
      <div class="info-row">
        <span class="label">Default Gateway:</span>
        <span class="val">192.168.4.1</span>
      </div>
      <div class="info-row">
        <span class="label">Default Device ID:</span>
        <span class="val">SF-001</span>
      </div>
      <div class="info-row">
        <span class="label">Bound Account:</span>
        <span class="val">mshiva5626</span>
      </div>
    </div>

    <p class="instructions">Point any phone camera at this QR code to auto-connect to chamber Wi-Fi</p>
  </div>

  <button class="print-btn" onclick="window.print()">Print Hardware Sticker</button>

</body>
</html>
