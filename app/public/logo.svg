<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183f27" />
      <stop offset="60%" stop-color="#0f291a" />
      <stop offset="100%" stop-color="#08180f" />
    </linearGradient>
    <linearGradient id="fg-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="fg-leaf" x1="20%" y1="15%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="fg-amber" x1="40%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="fg-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="fg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="26" fill="url(#fg-bg)" />
  <rect x="1" y="1" width="98" height="98" rx="25" stroke="url(#fg-rim)" stroke-width="2" fill="none" />
  <path d="M50 16L74 25V46C74 62 63.5 73.5 50 80C36.5 73.5 26 62 26 46V25L50 16Z"
        fill="rgba(16, 185, 129, 0.08)" stroke="rgba(74, 222, 128, 0.2)" stroke-width="1.5" />

  <!-- Botanical Leaf Wing (Left) -->
  <path d="M50 20C32 26 27 38 27 50C27 63 38 72 50 77C38 69 35 58 36 47C37 36 43 27 50 20Z"
        fill="url(#fg-leaf)" filter="url(#fg-shadow)" />

  <!-- Ethylene Trap Arc (Right) -->
  <path d="M50 20C65 26 71 37 71 50C71 63 60 72 50 77C60 69 63 58 62 47C61 36 56 27 50 20Z"
        fill="url(#fg-amber)" filter="url(#fg-shadow)" />

  <!-- Central Catalyst Sprout Core -->
  <path d="M50 31C44 40 44 48 50 56C56 48 56 40 50 31Z"
        fill="url(#fg-core)" filter="url(#fg-shadow)" />

  <!-- Vitality & Sensor Pulse Indicators -->
  <circle cx="50" cy="44" r="3.2" fill="#10b981" />
  <circle cx="50" cy="27" r="2.2" fill="#ffffff" />
</svg>
